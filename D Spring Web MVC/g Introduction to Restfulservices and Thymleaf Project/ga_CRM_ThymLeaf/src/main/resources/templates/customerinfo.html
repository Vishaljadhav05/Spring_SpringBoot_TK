<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Information</title>
   
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>Customer Management System</h2>
        
        <div style="margin-bottom: 20px;">
            <!-- URL Mapping for Adding a Customer -->
            <a th:href="@{/showForm}" class="btn btn-update">+ Add New Customer</a>
        </div>
        
        <table class="customer-table">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>City</th>
                    <th colspan="2" class="actions-header">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Iterating through customers list -->
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.firstName}">First Name Placeholder</td>
                    <td th:text="${customer.lastName}">Last Name Placeholder</td>
                    <td th:text="${customer.city}">City Placeholder</td>
                    
                    <!-- Update Action Link with Request Parameter -->
                    <td class="action-cell">
                        <a th:href="@{/updateForm(cxid=${customer.id})}" class="btn btn-update">Update</a>
                    </td>
                    
                    <!-- Delete Action Link with Request Parameter and Confirmation Box -->
                    <td class="action-cell">
                        <a th:href="@{/deleteData(cxid=${customer.id})}" 
                           class="btn btn-delete" 
                           onclick="return confirm('Are you sure you want to delete this customer?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
