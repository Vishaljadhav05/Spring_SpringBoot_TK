<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
    <!-- Maps the context path to ensure the stylesheet always loads -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/updatecss.css}">
</head>
<body>

    <div class="form-container">
        <h2>Register New Customer</h2>
        
        <!-- Evaluates the form endpoint dynamically, maintaining context paths -->
        <form th:action="@{/registerCustomer}" method="POST">
            
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required placeholder="Enter first name" />
            </div>
            
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Enter last name" />
            </div>
            
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required placeholder="Enter city" />
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-save">Add Customer</button>
                
                <!-- Evaluates the cancel path dynamically -->
                <a th:href="@{/cxinfo}" class="btn btn-cancel">Cancel</a>
            </div>
            
        </form>
    </div>

</body>
</html>
